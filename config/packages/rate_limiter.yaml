framework:
    rate_limiter:
        # Login pro Client-IP (bestehend).
        login:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'

        # Login zusätzlich pro E-Mail (gegen Magic-Link-Spam/Mailbomb).
        login_email:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'

        # Track-Uploads pro User (Bulk = eine Anfrage je Datei). Großzügig, damit
        # legitime Bulk-Importe durchgehen, aber Missbrauch gedrosselt wird.
        upload:
            policy: token_bucket
            limit: 150
            rate: { interval: '1 minute', amount: 10 }

        # Schreibende API-Endpunkte pro Client-IP (die /api-Firewall ist anonym).
        api_write:
            policy: sliding_window
            limit: 120
            interval: '15 minutes'

        # Fuer die eigenen Hintergrundlaeufe, die sich mit dem vereinbarten
        # Token ausweisen. Der Aktivitaetslauf schreibt einmal je Stadt, also
        # ueber 700 Anfragen am Stueck; der Eimer fasst das und fuellt sich mit
        # 200 je Minute nach. Eine ausser Kontrolle geratene Schleife bremst er
        # weiterhin.
        api_write_trusted:
            policy: token_bucket
            limit: 1000
            rate: { interval: '1 minute', amount: 200 }
