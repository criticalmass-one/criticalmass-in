framework:
    rate_limiter:
        # Login pro Client-IP (bestehend).
        login:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'

        # Login zusätzlich pro E-Mail (gegen Magic-Link-Spam/Mailbomb).
        login_email:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'

        # Passkey-Endpunkte pro Client-IP. Der Token Bucket verkraftet Lastspitzen —
        # die Conditional UI ruft /passkey/login/options bei jedem Aufruf der Login-Seite
        # auf — deckelt aber den Dauerdurchsatz.
        passkey:
            policy: token_bucket
            limit: 60
            rate: { interval: '1 minute', amount: 20 }

        # Track-Uploads pro User (Bulk = eine Anfrage je Datei). Großzügig, damit
        # legitime Bulk-Importe durchgehen, aber Missbrauch gedrosselt wird.
        upload:
            policy: token_bucket
            limit: 150
            rate: { interval: '1 minute', amount: 10 }

        # Statusbeitraege pro Nutzer. Kommentare und Forenantworten sind davon
        # ausgenommen: Wer mitdiskutiert, schreibt schnell mehrere hintereinander.
        status_post:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

        # Meldungen pro Nutzer, bei Gaesten pro IP. Wer einen ganzen Thread
        # durchmeldet, soll das koennen; wer die Moderation zuschuetten will, nicht.
        post_report:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

        # Schreibende API-Endpunkte pro Client-IP (die /api-Firewall ist anonym).
        api_write:
            policy: sliding_window
            limit: 120
            interval: '15 minutes'

        # Fuer die eigenen Hintergrundlaeufe, die sich mit dem vereinbarten
        # Token ausweisen. Der Aktivitaetslauf schreibt einmal je Stadt, also
        # ueber 700 Anfragen am Stueck; der Eimer fasst das und fuellt sich mit
        # 200 je Minute nach. Eine ausser Kontrolle geratene Schleife bremst er
        # weiterhin.
        api_write_trusted:
            policy: token_bucket
            limit: 1000
            rate: { interval: '1 minute', amount: 200 }
