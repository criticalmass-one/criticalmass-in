webauthn:
    credential_repository: App\Repository\WebauthnCredentialRepository
    user_repository: App\Security\Webauthn\UserEntityRepository

    # Basiswerte gelten für dev und test, wo die App unter localhost läuft. Ohne
    # `allowed_origins` prüft die Bibliothek den Origin gegen die RP ID, und das deckt
    # localhost ohne weiteres Zutun ab.
    #
    # Die Produktionswerte stehen in config/packages/prod/webauthn.yaml. Das ist bewusst
    # so herum: Config-Merge kann Listen nur ergänzen, nicht ersetzen — eine hier
    # gesetzte Origin-Liste liesse sich in keiner Umgebung wieder loswerden.
    creation_profiles:
        default:
            rp:
                id: 'localhost'
            authenticator_selection_criteria:
                user_verification: preferred
                # Discoverable Credential, sonst gibt es keine Conditional UI
                # (Passkey-Vorschlag im Autofill) auf der Login-Seite.
                resident_key: required
                require_resident_key: true

            # Ohne diese Liste schickt das Bundle ein leeres `pubKeyCredParams`, und der
            # Browser fällt auf seine Vorgabe ES256/RS256 zurück. Verifizieren kann das
            # Bundle deutlich mehr, also sagen wir es lieber selbst — absteigend nach
            # Präferenz. COSE-Kennungen: EdDSA, ES256, RS256.
            public_key_credential_parameters:
                - -8
                - -7
                - -257

    request_profiles:
        default:
            rp_id: 'localhost'
            user_verification: preferred

    # /.well-known/passkey-endpoints nach der W3C-Passkey-Endpoints-Spezifikation. Sagt
    # Passwortmanagern und Betriebssystemen, wo man bei uns einen Passkey anlegt und
    # verwaltet, damit sie direkt dorthin verlinken können. Der Routenname wird zur
    # Laufzeit über den Router zu einer absoluten URL aufgelöst — je nach angefragter
    # Domain also criticalmass.in oder criticalmass.one.
    passkey_endpoints:
        enabled: true
        enroll: 'criticalmass_user_profile_passkey_list'
        manage: 'criticalmass_user_profile_passkey_list'
