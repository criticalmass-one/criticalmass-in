security:
    providers:
        users:
            entity:
                class: 'App\Entity\User'
                property: 'email'

    firewalls:
        dev:
            pattern:  ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # MCP-Endpunkte: stateless, per OAuth2-Bearer-Token (Resource Server)
        # geschützt. Muss VOR der `main`-Firewall (pattern .*) stehen.
        mcp:
            pattern:    ^/mcp
            stateless:  true
            provider:   users
            oauth2:     true

        main:
            login_link:
                check_route: login_check
                signature_properties: [ 'email' ]
            remember_me:
                secret: '%kernel.secret%'
                # Konten haben kein Passwort (Login per Magic Link oder OAuth), daher
                # signiert das Cookie wie der login_link über die E-Mail-Adresse.
                signature_properties: [ 'email' ]
                lifetime: 31536000 # ein Jahr
                secure: auto
                samesite: lax
            # Passkeys als dritte Anmeldeart neben Magic Link und OAuth. Die Pfade sind
            # überschrieben: die Vorgaben des Bundles wären `/login/options` und
            # `POST /login` — und `POST /login` gehört bereits `login_perform`.
            #
            # Nur die Anmeldung läuft über die Firewall. Deren Registrierung ist der
            # Ablauf für *neue* Konten und lehnt jeden bestehenden Benutzernamen ab
            # („The username already exists“). Einen Passkey an ein vorhandenes Konto
            # hängen die Controller aus config/packages/webauthn.yaml.
            webauthn:
                authentication:
                    enabled: true
                    routes:
                        options_path: /passkey/login/options
                        result_path: /passkey/login
            provider: users
            pattern: .*
            context: user
            logout:
                invalidate_session: true
            oauth:
                resource_owners:
                    facebook: '/login/check-facebook'
                    strava: '/login/check-strava'
                login_path: '/login'
                failure_path: '/login'
                oauth_user_provider:
                    service: App\Security\UserProvider\UserProvider

        api:
            pattern:    ^/api
            stateless:  true
            security: false

    access_control:
        # URL of FOSUserBundle which need to be available to anonymous users
        - { path: ^/login$, role: PUBLIC_ACCESS }
        - { path: ^/register, role: PUBLIC_ACCESS }
        - { path: ^/resetting, role: PUBLIC_ACCESS }

        # Related Origin Requests: der Browser holt diese Liste, bevor er einen Passkey
        # mit RP ID criticalmass.one auf criticalmass.in zulässt.
        - { path: '^/\.well-known/webauthn$', role: PUBLIC_ACCESS }

        # Verweist Passwortmanager auf die Passkey-Verwaltung im Konto.
        - { path: '^/\.well-known/passkey-endpoints$', role: PUBLIC_ACCESS }

        # Anmelden per Passkey muss anonym möglich sein.
        - { path: ^/passkey/login, role: PUBLIC_ACCESS }
        # Einen Passkey anlegen dagegen nie: wer hier durchkäme, könnte sich einen
        # Authenticator auf ein fremdes Konto legen. Zweite Absicherung ist der
        # CurrentUserEntityGuesser in webauthn.yaml, der den Kontobezug aus der Sitzung
        # nimmt statt aus dem Request-Body.
        - { path: ^/passkey/register, role: ROLE_USER }

        # OAuth2 / MCP
        - { path: '^/\.well-known/oauth', role: PUBLIC_ACCESS }
        - { path: ^/token, role: PUBLIC_ACCESS }
        - { path: ^/oauth2/register, role: PUBLIC_ACCESS }
        - { path: ^/authorize, role: IS_AUTHENTICATED_FULLY }
        - { path: ^/oauth2/consent, role: ROLE_USER }
        - { path: ^/mcp, role: ROLE_USER }


    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER, ROLE_PHOTO_DOWNLOAD]
        ROLE_PHOTO_DOWNLOAD: [ROLE_USER]
        ROLE_USER: []

    access_decision_manager:
        strategy: unanimous
