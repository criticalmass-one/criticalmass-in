security:
    providers:
        users:
            entity:
                class: 'App\Entity\User'
                property: 'email'

    firewalls:
        dev:
            pattern:  ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # MCP-Endpunkte: stateless, per OAuth2-Bearer-Token (Resource Server)
        # geschützt. Muss VOR der `main`-Firewall (pattern .*) stehen.
        mcp:
            pattern:    ^/mcp
            stateless:  true
            provider:   users
            oauth2:     true

        main:
            login_link:
                check_route: login_check
                signature_properties: [ 'email' ]
            provider: users
            pattern: .*
            context: user
            logout:
                invalidate_session: true
            oauth:
                resource_owners:
                    facebook: '/login/check-facebook'
                    strava: '/login/check-strava'
                login_path: '/login'
                failure_path: '/login'
                oauth_user_provider:
                    service: App\Security\UserProvider\UserProvider

        # Hinweis: Es gibt bewusst KEINE eigene `api`-Firewall mehr. Ein Block
        # `api: { pattern: ^/api, security: false }` stand hier bis 2026-08 hinter
        # `main` (Zeile ~21, `pattern: .*`) und war damit tote Konfiguration --
        # `/api` lief immer schon unter `main`. Der Zugriffsschutz haengt deshalb
        # allein an den `access_control`-Regeln weiter unten.

    access_control:
        # API: Lesen bleibt oeffentlich (Apps, Partnerdienste, /api/doc),
        # Schreiben erfordert eine Anmeldung. Reihenfolge ist bindend --
        # die erste passende Regel gewinnt, deshalb steht das GET-Pattern zuerst.
        - { path: ^/api, methods: [GET, HEAD, OPTIONS], role: PUBLIC_ACCESS }
        - { path: ^/api, role: ROLE_USER }

        # URL of FOSUserBundle which need to be available to anonymous users
        - { path: ^/login$, role: PUBLIC_ACCESS }
        - { path: ^/register, role: PUBLIC_ACCESS }
        - { path: ^/resetting, role: PUBLIC_ACCESS }

        # OAuth2 / MCP
        - { path: '^/\.well-known/oauth', role: PUBLIC_ACCESS }
        - { path: ^/token, role: PUBLIC_ACCESS }
        - { path: ^/oauth2/register, role: PUBLIC_ACCESS }
        - { path: ^/authorize, role: IS_AUTHENTICATED_FULLY }
        - { path: ^/oauth2/consent, role: ROLE_USER }
        - { path: ^/mcp, role: ROLE_USER }


    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER, ROLE_PHOTO_DOWNLOAD]
        ROLE_PHOTO_DOWNLOAD: [ROLE_USER]
        ROLE_USER: []

    access_decision_manager:
        strategy: unanimous
