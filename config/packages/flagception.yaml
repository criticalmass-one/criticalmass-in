flagception:
    features:
        photos:
            default: true
        art11:
            default: false
        frontpage_advertisment:
            default: false
        strava_track_upload:
            default: true
        oembed:
            default: true
        # Statusbeitraege auf der Stadtseite. Bleibt aus, bis Beitraege gemeldet
        # werden koennen; einschalten mit FEATURE_STATUS_POSTS=true in der .env.local.
        status_posts:
            default: false
            env: FEATURE_STATUS_POSTS
        # Umschalter auf die neue Ansicht (templates/v2/, Stylesheet app-v2). Aus, bis
        # genug Seiten neu sind; einschalten mit FEATURE_DESIGN_V2=true in der .env.local.
        design_v2:
            default: false
            env: FEATURE_DESIGN_V2
